<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia Night</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>
<main>
  <section id="home" class="card">
    <div class="badge">REAL-TIME • SOCIAL DEDUCTION</div>
    <h1>MAFIA <span>NIGHT</span></h1>
    <p class="sub">Trust nobody. Survive the night. Find the Mafia.</p>
    <input id="name" maxlength="18" placeholder="Your name">
    <div class="row"><button onclick="create()">CREATE ROOM</button><button class="ghost" onclick="showJoin()">JOIN ROOM</button></div>
    <div id="joinBox" class="hidden"><input id="code" maxlength="5" placeholder="ROOM CODE"><button onclick="join()">JOIN</button></div>
    <p id="msg" class="msg"></p>
  </section>

  <section id="lobby" class="card hidden">
    <div class="top"><div><div class="badge">ROOM</div><h2 id="roomCode"></h2></div><button class="ghost" onclick="copyCode()">COPY CODE</button></div>
    <p>Share the code with your friends.</p>
    <div id="players" class="players"></div>
    <div class="row"><button onclick="ready()">READY</button><button id="startBtn" onclick="start()">START GAME</button></div>
    <p id="lobbyMsg" class="msg"></p>
  </section>

  <section id="game" class="card hidden">
    <div class="top"><div><div class="badge" id="phaseBadge">NIGHT</div><h2 id="phaseTitle">Night falls...</h2></div><div class="day" id="day">DAY 1</div></div>
    <div id="roleBox" class="role hidden"></div>
    <p id="instruction"></p>
    <div id="targets" class="targets"></div>
    <div id="status" class="status"></div>
    <div id="winner" class="winner hidden"></div>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body></html>
